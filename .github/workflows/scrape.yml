name: Find LinkedIn jobs

# Hourly full sweep that feeds the hourly apply/digest task (data/jobs.json).
# Instant 24x7 alerts come from the live runner (live/setup_live.sh) on an always-on machine.
on:
  schedule:
    - cron: "20 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python scraper.py
      - name: Save results
        run: |
          git config user.name "job-bot"
          git config user.email "job-bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "jobs: $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase -X theirs || true
          git push
