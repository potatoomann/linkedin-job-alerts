name: Find LinkedIn jobs

on:
  schedule:
    - cron: "52 23,6,12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python scraper.py
      - name: Save results
        run: |
          git config user.name "job-bot"
          git config user.email "job-bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "jobs: $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
